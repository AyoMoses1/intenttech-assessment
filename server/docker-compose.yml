services:
  ### DB ################################################
  db:
    image: postgres:latest
    platform: linux/arm64/v8 # For M1/M2 Mac
    restart: always
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: intenttech
      POSTGRES_USER: postgres
    volumes:
      - ./.data/db:/var/lib/postgresql/data
    ports:
      - "5434:5432"
